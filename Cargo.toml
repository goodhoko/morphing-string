[package]
name = "morphing-string"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Morph one string into another, one edit at a time."
license-file = "LICENSE"
repository = "https://github.com/goodhoko/morphing-string"
readme = "README.md"
keywords = ["text", "morphing", "levenshtein", "animation", "tui"]
categories = ["text-processing", "visualization"]

[dev-dependencies]
crossterm = "0.29"
# `glow` rather than the default `wgpu` backend, and no `accesskit`/`persistence`:
# an example needs none of the weight the defaults bring.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
